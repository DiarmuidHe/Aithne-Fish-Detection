[project]
name = "fish-monitor"
version = "0.2.0"
description = "Production-oriented starter backend for underwater fish detection and tracking with VIAME."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.1",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.29",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
live = [
    "opencv-python-headless>=4.10.0.84",
    "yt-dlp>=2025.1.26",
]
annotate = [
    "opencv-python-headless>=4.10.0.84",
]
dev = [
    "opencv-python-headless>=4.10.0.84",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["fixtures/*.csv", "viame_pipelines/*.pipe", "templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
